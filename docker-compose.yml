services:
  audiopdf:
    build: .
    image: audiopdf:local
    container_name: audiopdf
    ports:
      - "8000:8000"
    volumes:
      - audiopdf-data:/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://audiopdf:audiopdf@db:5432/audiopdf
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: audiopdf-db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-audiopdf}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-audiopdf}
      - POSTGRES_DB=${POSTGRES_DB:-audiopdf}
    volumes:
      - audiopdf-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-audiopdf} -d ${POSTGRES_DB:-audiopdf}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  audiopdf-data:
  audiopdf-db:
