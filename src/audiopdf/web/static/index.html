<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio-PDF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230A5C57'/%3E%3Cpath d='M7 14v-4M11 17V7M15 15V9M19 13v-2' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="Audio-PDF, início">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 14v-4M9.5 18V6M14 15V9M18.5 13v-2"/></svg>
    Audio-PDF
  </a>
  <nav aria-label="Principal">
    <a href="#/" id="nav-lib">Biblioteca</a>
    <a href="#/new" id="nav-new">Novo audiobook</a>
  </nav>
  <span class="grow"></span>
  <div id="userbar"></div>
</header>

<main id="app" tabindex="-1"></main>

<section id="player" aria-label="Player" hidden>
  <div class="pl">
    <div class="info"><div class="cover mini" id="pl-cover" aria-hidden="true"></div><div><b id="pl-title"></b><span id="pl-sub"></span></div></div>
    <div class="mid">
      <div class="ctl">
        <button class="btn icon ghost" id="pl-back" aria-label="Voltar 30 segundos" title="Voltar 30 s (←)"></button>
        <button class="play" id="pl-play" aria-label="Reproduzir" title="Reproduzir ou pausar (espaço)"></button>
        <button class="btn icon ghost" id="pl-fwd" aria-label="Avançar 30 segundos" title="Avançar 30 s (→)"></button>
      </div>
      <div class="scrub">
        <span class="time num" id="pl-cur">0:00</span>
        <input type="range" id="pl-scrub" min="0" max="1000" value="0" step="1" aria-label="Posição no capítulo">
        <span class="time num" id="pl-dur">0:00</span>
      </div>
    </div>
    <div class="mob-ctl" id="pl-mob"></div>
    <div class="aux">
      <button class="btn ghost" id="pl-reader" aria-label="Acompanhar leitura no PDF" aria-pressed="false" title="Acompanhar no PDF"></button>
      <button class="btn ghost" id="pl-rate" aria-label="Velocidade de reprodução" title="Velocidade">1x</button>
      <button class="btn ghost" id="pl-sleep" aria-label="Timer de sono" title="Timer de sono"></button>
      <button class="btn icon ghost" id="pl-close" aria-label="Fechar player" title="Fechar"></button>
    </div>
  </div>
  <audio id="audio" preload="auto"></audio>
</section>

<aside id="reader" aria-label="Acompanhar leitura no PDF" hidden></aside>

<div id="toasts" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
