[project]
name = "audiopdf"
version = "0.0.1"
description = "PDF -> audiobook (Fase 0: CLI, texto selecionável, sem tradução)"
requires-python = ">=3.12"
dependencies = [
  "pymupdf>=1.24",
  "azure-cognitiveservices-speech>=1.38",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
translate = ["argostranslate>=1.9", "lingua-language-detector>=2.0"]
kokoro = ["kokoro>=0.9", "soundfile>=0.12"]  # exige: brew install espeak-ng
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
audiopdf = "audiopdf.cli:main"
audiopdf-web = "audiopdf.web.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"audiopdf.web" = ["static/*"]
